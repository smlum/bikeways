name: network_segments
description: Standardized cycling network segments, one row per segment, for a single pipeline run (data_year).

fields:
  - name: segment_id
    type: string
    required: true
    description: Unique ID for this row within this run only; not stable across years.

  - name: source_id
    type: string
    required: true
    description: Foreign key to the source registry entry (municipality + dataset/layer).

  - name: source_feature_id
    type: string
    required: false
    description: Original ID/key from the source dataset, if present; for reference only.

  - name: data_year
    type: integer
    required: true
    description: Vintage this pipeline run represents (e.g. 2026).

  - name: geometry
    type: geometry
    geometry_type: LineString
    crs: EPSG:4326
    required: true

  - name: csduid
    type: string
    required: true
    description: StatCan census subdivision unique identifier, assigned via segment midpoint.

  - name: csdname
    type: string
    required: true

  - name: province
    type: string
    required: true

  - name: source_class
    type: string
    required: true
    description: Original primary classification value from the source.

  - name: source_class_secondary
    type: string
    required: false
    description: Original secondary/sub-classification value from the source, if present.

  - name: canbics_class
    type: string
    required: true
    enum:
      - cycle_track
      - local_street_bikeway
      - bike_path
      - multi_use_path
      - painted_bike_lane
      - major_shared_roadway
      - shared_roadway
      - gravel_trail
    description: Harmonized Can-BICS classification. See reference/canbics_classification.md.

  - name: canbics_tier
    type: string
    required: true
    enum: [high, medium, low, non_conforming]
    description: Derived from canbics_class; may be dropped from the final published output.

  - name: classification_method
    type: string
    required: true
    enum: [rule, manual]
    description: How canbics_class was assigned for this segment's source_class.

  - name: classification_notes
    type: string
    required: false

  - name: surface_type
    type: string
    required: false
    description: Not part of Can-BICS; recorded when the source provides it.

  - name: width_m
    type: float
    required: false
    description: Not part of Can-BICS; recorded when the source provides it.

  - name: install_year
    type: integer
    required: false
    description: Year facility was introduced, if known.

  - name: length_km
    type: float
    required: true
    description: Computed in a projected CRS.
