name: sources
description: Registry of individual datasets ingested from data providers, one entry per dataset/domain.

fields:
  - name: source_id
    type: string
    required: true
    description: Stable ID, e.g. on_toronto_cycling.

  - name: provider_id
    type: string
    required: true
    description: Foreign key to provider_id in ca-data-providers/providers.csv.

  - name: dataset_page_url
    type: string
    required: true
    description: Portal page describing this specific dataset.

  - name: download_url
    type: string
    required: false
    description: Direct download link, if stable.

  - name: format
    type: string
    required: true
    enum: [geojson, shapefile, gpkg, parquet, csv, json, arcgis_rest, other]

  - name: license_name
    type: string
    required: false

  - name: license_url
    type: string
    required: false

  - name: open_license
    type: boolean
    required: false
    description: Whether this source has a genuinely open license permitting reuse, as opposed to requiring permission (e.g. "Request permission to use"). Unset until reviewed.

  - name: contact
    type: string
    required: false

  - name: source_updated_date
    type: date
    required: true
    description: Date the source itself claims as last updated/published.

  - name: retrieved_date
    type: date
    required: true
    description: Date we downloaded this file.

  - name: data_dictionary_url
    type: string
    required: false
    description: Link to the source's own data dictionary, if published.

  - name: raw_filename
    type: string
    required: true
    description: Filename as stored under data/raw/<source_id>/.

  - name: notes
    type: string
    required: false
