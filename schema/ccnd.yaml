name: network_segments
description: Standardized cycling network segments, one row per segment, for a single pipeline run (data_year).

fields:
  - name: segment_id
    type: string
    required: true
    description: Unique ID for this row within this run only; not stable across years.

  - name: source_id
    type: string
    required: true
    description: Foreign key to the source registry entry (provider + dataset/layer).

  - name: source_feature_id
    type: string
    required: false
    source_mappable: true
    description: Original ID/key from the source dataset, if present; for reference only.

  - name: data_year
    type: integer
    required: true
    description: Vintage this pipeline run represents (e.g. 2026).

  - name: geometry
    type: geometry
    geometry_type: LineString
    crs: EPSG:4326
    required: true
    source_mappable: true

  - name: csduid
    type: string
    required: true
    description: StatCan census subdivision unique identifier, assigned via segment midpoint.

  - name: csdname
    type: string
    required: true

  - name: province
    type: string
    required: true

  - name: source_class
    type: string
    required: true
    source_mappable: true
    description: Original primary classification value from the source.

  - name: source_class_secondary
    type: string
    required: false
    source_mappable: true
    description: Original secondary/sub-classification value from the source, if present.

  - name: canbics_class
    type: string
    required: true
    enum:
      - cycle_track
      - local_street_bikeway
      - bike_path
      - multi_use_path
      - painted_bike_lane
      - major_shared_roadway
      - shared_roadway
      - gravel_trail
    description: Harmonized Can-BICS classification. See reference/canbics_classification.md.

  - name: canbics_tier
    type: string
    required: true
    enum: [high, medium, low, non_conforming]
    description: Derived from canbics_class; may be dropped from the final published output.

  - name: classification_method
    type: string
    required: true
    enum: [rule, manual]
    description: How canbics_class was assigned for this segment's source_class.

  - name: classification_notes
    type: string
    required: false

  - name: source_surface_type
    type: string
    required: false
    source_mappable: true
    description: Raw surface value, verbatim. Not part of Can-BICS.

  - name: source_width
    type: float
    required: false
    source_mappable: true
    description: Raw width, verbatim, in whatever unit the source uses (see column_map.yaml's width_unit).

  - name: width_m
    type: float
    required: false
    description: source_width converted to meters during preprocessing.

  - name: source_install_date
    type: string
    required: false
    source_mappable: true
    description: Raw install date, verbatim (format varies by source).

  - name: install_year
    type: integer
    required: false
    description: Year facility was introduced, parsed from source_install_date during preprocessing.

  - name: source_status
    type: string
    required: false
    source_mappable: true
    description: Raw status/lifecycle value, verbatim, if provided. Absent means the source doesn't distinguish status (treated as existing).

  - name: status
    type: string
    required: true
    enum: [existing, proposed, planned, under_construction, removed, other]
    description: Harmonized status, derived from source_status. Used to filter out non-existing segments before computing length.

  - name: source_road_type
    type: string
    required: false
    source_mappable: true
    description: Raw underlying-road classification, verbatim (e.g. arterial, residential) — the road itself, not the bikeway (that's source_class).

  - name: source_snow_removal
    type: string
    required: false
    source_mappable: true
    description: Raw snow-removal/winter-maintenance indicator, verbatim (format varies by source). No harmonized version yet.

  - name: source_upgrade_date
    type: string
    required: false
    source_mappable: true
    description: Raw most-recent-upgrade/reconstruction date, verbatim — distinct from source_install_date (original installation).

  - name: length_km
    type: float
    required: true
    description: Computed in a projected CRS.
