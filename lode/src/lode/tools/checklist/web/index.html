<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checklist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="title-block">
      <h1>Data source checklist</h1>
      <div id="checklist-path" class="meta"></div>
    </div>
    <div id="progress"></div>
    <label class="toggle">
      <input type="checkbox" id="unchecked-only" checked />
      Show unchecked only
    </label>
  </header>
  <table id="rows">
    <colgroup>
      <col style="width: 210px" />
      <col style="width: 140px" />
      <col style="width: 195px" />
      <col style="width: 260px" />
      <col />
    </colgroup>
    <thead>
      <tr>
        <th>Provider</th>
        <th>Portal</th>
        <th>Actions</th>
        <th>Source URL</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="rows-body"></tbody>
  </table>
  <script src="app.js"></script>
</body>
</html>
